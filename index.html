<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RETROVERSE</title>
  </head>

  <body>
    <div id="splash" style="position:fixed;inset:0;z-index:99999;background:#0b0d12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-family:sans-serif;color:#e6e9f0;overflow:hidden;">
      <div style="position:absolute;inset:0;background:radial-gradient(600px 300px at 50% 40%,rgba(124,92,255,.12),transparent);"></div>
      <div style="width:96px;height:96px;border-radius:22px;background:linear-gradient(135deg,#7c5cff,#5ad1ff);display:grid;place-items:center;font-size:52px;font-weight:800;color:white;box-shadow:0 16px 48px rgba(124,92,255,.5);animation:pulse 1.6s ease-in-out infinite;">R</div>
      <div style="font-size:24px;font-weight:700;letter-spacing:1.5px;">RETROVERSE</div>
      <div style="font-size:12px;color:#6b7386;">The Universal Video Game Collection Companion</div>
      <div style="width:200px;height:4px;background:#1a1e28;border-radius:2px;overflow:hidden;margin-top:14px;position:relative;">
        <div style="position:absolute;top:0;left:0;height:100%;width:40%;background:linear-gradient(90deg,#7c5cff,#5ad1ff);border-radius:2px;animation:slide 1.2s ease-in-out infinite;"></div>
      </div>
      <div style="font-size:11px;color:#9aa3b5;margin-top:6px;">Chargement…</div>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}@keyframes slide{0%{left:-40%}100%{left:100%}}</style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
