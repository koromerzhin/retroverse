<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RETROVERSE</title>

  <body>
    <div id="splash" style="position:fixed;inset:0;z-index:99999;background:#0b0d12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-family:sans-serif;color:#e6e9f0;">
      <div style="width:80px;height:80px;border-radius:18px;background:linear-gradient(135deg,#7c5cff,#5ad1ff);display:grid;place-items:center;font-size:44px;font-weight:800;color:white;box-shadow:0 12px 40px rgba(124,92,255,.4);">R</div>

      <div style="font-size:12px;color:#6b7386;">The Universal Video Game Collection Companion</div>
      <div style="width:24px;height:24px;border:3px solid #2a3040;border-top-color:#7c5cff;border-radius:50%;animation:spin .8s linear infinite;margin-top:10px;"></div>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
