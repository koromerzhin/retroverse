[package]
name = "retroverse"
version = "1.0.0"
description = "RETROVERSE - The Universal Video Game Collection Companion"
authors = ["koromerzhin"]
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "retroverse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["webview-data-url"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time"] }
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
sha1 = "0.11"
md5 = "0.8"
crc = "3"
zip = "2"
sevenz-rust = "0.6"
russh = "0.65"
russh-sftp = "3.0"
ureq = { version = "3", features = ["rustls", "json"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
ksni = "0.3"
base64 = "0.23"
notify-rust = "4"
dirs = "5"
anyhow = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
