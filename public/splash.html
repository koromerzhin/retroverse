<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RETROVERSE</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0b0d12; overflow: hidden; }
      .splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        font-family: sans-serif; color: #e6e9f0; overflow: hidden;
      }
      .glow { position: absolute; inset: 0; background: radial-gradient(600px 300px at 50% 40%, rgba(124,92,255,.12), transparent); }
      .logo { width: 96px; height: 96px; border-radius: 22px; background: linear-gradient(135deg,#7c5cff,#5ad1ff); display: grid; place-items: center; font-size: 52px; font-weight: 800; color: white; box-shadow: 0 16px 48px rgba(124,92,255,.5); animation: pulse 1.6s ease-in-out infinite; }
      .title { font-size: 24px; font-weight: 700; letter-spacing: 1.5px; }
      .subtitle { font-size: 12px; color: #6b7386; }
      .bar { width: 200px; height: 4px; background: #1a1e28; border-radius: 2px; overflow: hidden; margin-top: 14px; position: relative; }
      .bar > div { position: absolute; top: 0; left: 0; height: 100%; width: 40%; background: linear-gradient(90deg,#7c5cff,#5ad1ff); border-radius: 2px; animation: slide 1.2s ease-in-out infinite; }
      .status { font-size: 11px; color: #9aa3b5; margin-top: 6px; }
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="glow"></div>
      <div class="logo">R</div>
      <div class="title">RETROVERSE</div>
      <div class="subtitle">The Universal Video Game Collection Companion</div>
      <div class="bar"><div></div></div>
      <div class="status">Chargement…</div>
    </div>
  </body>
</html>
